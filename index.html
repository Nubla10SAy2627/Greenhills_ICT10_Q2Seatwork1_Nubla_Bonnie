<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nickname Atlas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The Nickname Atlas of Southeast Asia</h1>
        <p>Every nation in this region carries a name earned through geography, history, and myth! Type a country below to uncover the title it has been given.</p>

    <div>
        <p>Country Look up</p>
        <h1>Enter a Southeast Asian Country</h1>

        <select id="select_country">
            <option value="The Kingdom of Wonder">Cambodia</option>
            <option value="Land of a Million Elephants">Laos</option>
            <option value="Golden Land">Myanmar</option>
            <option value="Land of Smiles">Thailand</option>
            <option value="Land of the Ascending Dragon">Vietnam</option>
            <option value="Abode of Peace">Brunei</option>
            <option value="Emerald of the Equator">Indonesia</option>
            <option value="Truly Asia">Malaysia</option>
            <option value="Pearl of the Orient Seas">Philippines</option>
            <option value="Lion City">Singapore</option>
            <option value="Land of the Rising Sun">Timor-Leste</option>
        </select><br>

        <input type="button" py-click="find_nickname" value="Find Nickname">

        <div id="display"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
